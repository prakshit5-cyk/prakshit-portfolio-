<style>:root{--bg:#050507;--surface:#101016;--text:#f6f5fa;--muted:#b0aec0;--accent:#8b5cf6;--accent-soft:#c4b5fd;--border:#25243a;--radius:14px;--section:96px;--shadow:none;--dur:.5s;--font-h:system-ui,sans-serif;--font-b:system-ui,sans-serif}

.stats b{display:block;font:700 1.5rem var(--font-h);color:var(--accent-soft)}.stats span{font-size:.9rem;color:var(--muted)}
.cat{margin-bottom:56px}.cat h3{font-size:1.5rem}.cat>p{margin:0 0 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.card .info{padding:14px 16px 16px}.card p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}
.card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.frame{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#1a1230,#0b0b12)}
.frame.doc{aspect-ratio:4/3}.frame.big{aspect-ratio:4/3;max-height:80vh}
.frame iframe,.frame .poster{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{display:grid;place-items:center;background:none;padding:0;cursor:pointer;border:0;color:#fff}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:relative;width:68px;height:68px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:1.6rem;transition:transform .2s}
.poster:hover .play{transform:scale(1.1)}
.spin{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem;z-index:0}
.frame iframe{z-index:1;background:transparent}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:24px;color:var(--muted)}
footer{padding:80px 5vw 40px;text-align:center;color:var(--muted);font-size:.9rem}
dialog{width:min(1100px,94vw);height:90vh;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:12px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
